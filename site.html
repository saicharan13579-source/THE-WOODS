<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f5d3a">
<title>The Woods Site Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}
/* Layout: two portals. Villa portal opens on the master plan (tap a plot → its drawings by discipline); Site portal lists whole-layout drawings. Glass panels over a fluid backdrop; dark sheet viewer. */
:root{
  --sheet:#ffffff; --rule:#d9ddd5;
  --forest:#2f5d3a; --forest-ink:#ffffff; --forest-soft:#e3ece2;
  --c-arch:#2b5c8a; --c-str:#9a4b1c; --c-land:#3b7a3e; --c-site:#6a4f8f; --c-3d:#7a6a2a; --c-mep:#0d7287;
  --east:#2b6cb0; --west:#c56a12; --model:#1f7a3a; --tab-ink:#ffffff;
  --ok:#1f7a3a; --ok-bg:#dff1e3; --warn:#8a5a00; --warn-bg:#fbefd2; --bad:#9b2c2c; --bad-bg:#f8e0de; --ref:#4a5560; --ref-bg:#e7eaec;
  --base:#e6efe9; --b1:#9fd8c0; --b2:#b9d3f2; --b3:#d8e9a8; --b4:#7fc4b0;
  --glass:rgba(255,255,255,.80); --glass-strong:rgba(255,255,255,.88); --glass-edge:rgba(255,255,255,.95);
  --glass-line:rgba(24,40,30,.12); --shadow:0 8px 28px rgba(20,45,32,.12);
  --ink:#0d1712; --muted:#3e4b43; --paper:rgba(255,255,255,.92);
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sheet:#1a201c; --rule:#2c342f; --forest:#7fbf8a; --forest-ink:#0f1a12; --forest-soft:#1f2d22;
  --c-arch:#7fb0de; --c-str:#e39a6a; --c-land:#8fcf8f; --c-site:#b9a0dc; --c-3d:#d6c27a; --c-mep:#73cbd8;
  --east:#7fb0f0; --west:#f0a65a; --model:#8fd6a0; --tab-ink:#0d1712;
  --ok:#8fd6a0; --ok-bg:#163522; --warn:#f0c66a; --warn-bg:#3a2e12; --bad:#f2a19a; --bad-bg:#3d1c1a; --ref:#b8c2cc; --ref-bg:#262d33;
  --base:#08110d; --b1:#0f5a45; --b2:#1d3a6b; --b3:#3d5a1c; --b4:#0b6b66;
  --glass:rgba(16,24,20,.82); --glass-strong:rgba(14,21,17,.88); --glass-edge:rgba(255,255,255,.14);
  --glass-line:rgba(255,255,255,.12); --shadow:0 10px 30px rgba(0,0,0,.45);
  --ink:#f3f7f2; --muted:#c3cfc6; --paper:rgba(10,16,13,.88); color-scheme:dark }}
:root[data-theme="dark"]{
  --sheet:#1a201c; --rule:#2c342f; --forest:#7fbf8a; --forest-ink:#0f1a12; --forest-soft:#1f2d22;
  --c-arch:#7fb0de; --c-str:#e39a6a; --c-land:#8fcf8f; --c-site:#b9a0dc; --c-3d:#d6c27a; --c-mep:#73cbd8;
  --east:#7fb0f0; --west:#f0a65a; --model:#8fd6a0; --tab-ink:#0d1712;
  --ok:#8fd6a0; --ok-bg:#163522; --warn:#f0c66a; --warn-bg:#3a2e12; --bad:#f2a19a; --bad-bg:#3d1c1a; --ref:#b8c2cc; --ref-bg:#262d33;
  --base:#08110d; --b1:#0f5a45; --b2:#1d3a6b; --b3:#3d5a1c; --b4:#0b6b66;
  --glass:rgba(16,24,20,.82); --glass-strong:rgba(14,21,17,.88); --glass-edge:rgba(255,255,255,.14);
  --glass-line:rgba(255,255,255,.12); --shadow:0 10px 30px rgba(0,0,0,.45);
  --ink:#f3f7f2; --muted:#c3cfc6; --paper:rgba(10,16,13,.88); color-scheme:dark }
body.site-portal{--forest:#1d5f73;--forest-soft:#dcecf0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.site-portal{--forest:#73cbd8;--forest-soft:#13303a}}
:root[data-theme="dark"] body.site-portal{--forest:#73cbd8;--forest-soft:#13303a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--base);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass-strong)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.fluid{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--base)}
.fluid i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.75}
.fluid i:nth-child(1){background:var(--b1);top:-22vmax;left:-18vmax;animation:d1 26s ease-in-out infinite alternate}
.fluid i:nth-child(2){background:var(--b2);top:10vmax;right:-26vmax;animation:d2 32s ease-in-out infinite alternate}
.fluid i:nth-child(3){background:var(--b3);bottom:-30vmax;left:8vmax;animation:d3 30s ease-in-out infinite alternate}
.fluid i:nth-child(4){background:var(--b4);top:38vmax;left:-24vmax;width:44vmax;height:44vmax;animation:d2 36s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,10vmax) scale(.9)}}
@keyframes d3{to{transform:translate(12vmax,-16vmax) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.fluid i{animation:none!important}*{transition:none!important}}

/* header */
header.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border-bottom:1px solid var(--glass-line);box-shadow:var(--shadow)}
.tb .wrap{display:grid;gap:10px;padding-block:12px}
.tb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.proj{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.proj h1{margin:0;font-size:26px;line-height:1.05;font-weight:700;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.proj h1 a{text-decoration:none}
.proj h1 .w{color:var(--forest)}
.portal-tag{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--forest);color:var(--forest-ink)}
.portal-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:15px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--forest);color:var(--forest);background:var(--paper)}
.searchrow{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--glass-line);border-radius:14px;padding:0 10px;height:46px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%;outline:none}
.search button{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:6px}
.views{display:flex;border:1px solid var(--glass-line);border-radius:14px;overflow:hidden;flex:none;background:var(--paper)}
.views button,.views a{border:0;background:transparent;padding:0 14px;height:44px;font-weight:600;cursor:pointer;font-size:15px;white-space:nowrap;display:flex;align-items:center;justify-content:center;text-decoration:none}
.views [aria-pressed="true"],.views [aria-current="page"]{background:var(--forest);color:var(--forest-ink)}
@media (max-width:560px){.views{flex:1 1 100%}.views button,.views a{flex:1;padding:0 8px}}

main{padding-block:18px 60px;display:grid;gap:22px}
.panel,.grp-h,footer,.empty,.lead,.card{background:var(--glass);border:1px solid var(--glass-edge);border-radius:18px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-edge);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.panel{padding:14px 16px;min-width:0}
.panel summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:'Show';font-family:var(--f-mono);font-size:12px;color:var(--forest);font-weight:600}
.panel details[open] summary::after{content:'Hide'}
.panel details[open] summary{margin-bottom:10px}
h2.k{margin:0;font-size:13px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--ink)}
.alert b.k{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);padding-top:2px}
.alert.bad{background:var(--bad-bg)} .alert.bad b.k{color:var(--bad)}
.alert.info{background:var(--ref-bg)} .alert.info b.k{color:var(--ref)}
.lead{margin:0;padding:12px 16px;font-size:15px}
footer{padding:14px 16px;color:var(--muted);font-size:13px}
.empty{padding:24px 16px;color:var(--muted);text-align:center}

/* master plan */
.mp{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:980px){.mp{grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);align-items:start}.mp .mapbox{max-height:none}}
.card{padding:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-h h2{margin:0;font-size:20px;font-weight:700}
.card-h p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.zoomctl{display:flex;gap:6px}
.zbtn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--glass-line);background:var(--paper);font-weight:700;font-size:16px;cursor:pointer}
.mapbox{background:#fff;border-radius:12px;border:1px solid var(--glass-line);overflow:auto;max-height:78vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mapzoom{position:relative;width:100%;margin:0 auto;transition:width .2s ease}
.mapzoom img{display:block;width:100%;height:auto;max-width:none}
.mapzoom svg{position:absolute;inset:0;width:100%;height:100%}
.plot{cursor:pointer}
.plot rect{fill:var(--pc);fill-opacity:.14;stroke:var(--pc);stroke-opacity:.0;stroke-width:6;transition:fill-opacity .15s}
.plot:hover rect,.plot:focus rect{fill-opacity:.32;stroke-opacity:.9}
.plot.st-available{--pc:#8a7a4f} .plot.st-booked{--pc:#e3a12f} .plot.st-registered{--pc:#d9651c} .plot.st-blocked{--pc:#7d8580}
.plot.st-available rect{fill-opacity:.06}.plot.st-booked rect,.plot.st-registered rect,.plot.st-blocked rect{fill-opacity:.5}
.plot.m rect{stroke:#1f9a46;stroke-opacity:1;stroke-width:12}
.asof{margin:6px 0 0;font-size:12px;color:var(--muted)}
.plot.vt-std{--pc:#2e9e4f} .plot.vt-custom{--pc:#8b4fd6} .plot.vt-blocked{--pc:#7d8580} .plot.vt-none{--pc:#8a7a4f}
.plot.vt-std rect,.plot.vt-custom rect,.plot.vt-blocked rect{fill-opacity:.5}.plot.vt-none rect{fill-opacity:.06}
.sw.vt-std{color:#1f7a3a;background:#58b873} .sw.vt-custom{color:#6a33b0;background:#a678e6} .sw.vt-blocked{color:#6c736f;background:#9aa09c} .sw.vt-none{color:#b8a77a;background:#f3e9d4}
.pbtn.vt-std{--pc:#2e9e4f;background:rgba(46,158,79,.16)} .pbtn.vt-custom{--pc:#8b4fd6;background:rgba(139,79,214,.16)} .pbtn.vt-blocked{--pc:#7d8580;background:rgba(125,133,128,.2)} .pbtn.vt-none{--pc:#c9b98f}
.pbtn.st-available{--pc:#c9b98f} .pbtn.st-booked{--pc:#e3a12f;background:rgba(227,161,47,.18)} .pbtn.st-registered{--pc:#d9651c;background:rgba(217,101,28,.18)} .pbtn.st-blocked{--pc:#7d8580;background:rgba(125,133,128,.2)}
.mmode{display:flex;align-items:center;gap:0;margin-top:10px;flex-wrap:wrap;font-size:14px}
.mmode span{margin-right:8px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mmode button{border:1px solid var(--glass-line);background:var(--paper);padding:7px 12px;font-weight:600;cursor:pointer}
.mmode button:first-of-type{border-radius:10px 0 0 10px}.mmode button:last-of-type{border-radius:0 10px 10px 0;border-left:0}
.mmode button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.plot.sel rect{fill-opacity:.45;stroke-opacity:1;stroke-width:10}
.plot:focus{outline:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:2px solid currentColor;display:inline-block}
.sw.st-available{color:#b8a77a;background:#f3e9d4} .sw.st-booked{color:#c98a1c;background:#e8b24f} .sw.st-registered{color:#b4510f;background:#dd7430} .sw.st-blocked{color:#6c736f;background:#9aa09c} .sw.m{color:#1f9a46;background:transparent}
.plotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pbtn{display:grid;gap:0;justify-items:center;padding:7px 4px;border-radius:10px;border:1px solid var(--glass-line);background:var(--paper);cursor:pointer;text-decoration:none;border-bottom:3px solid var(--pc)}
.pbtn b{font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.pbtn small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.pbtn.s-available{--pc:#c9b98f} .pbtn.s-booked{--pc:#e3a12f;background:rgba(227,161,47,.18)} .pbtn.s-registered{--pc:#d9651c;background:rgba(217,101,28,.18)} .pbtn.s-blocked{--pc:#7d8580;background:rgba(125,133,128,.2)} .pbtn.m{outline:2px solid var(--model);outline-offset:-2px}
.side{display:grid;gap:14px;min-width:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat.stat4{grid-template-columns:repeat(4,1fr)}
.stat .sc-booked{border-bottom:3px solid #e3a12f}.stat .sc-registered{border-bottom:3px solid #d9651c}.stat .sc-blocked{border-bottom:3px solid #7d8580}.stat .sc-available{border-bottom:3px solid #c9b98f}
.stat div{background:var(--paper);border:1px solid var(--glass-line);border-radius:12px;padding:10px;display:grid;gap:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.feature{display:flex;gap:12px;align-items:center;text-decoration:none;padding:12px;border-radius:14px;background:var(--forest-soft);border:1px solid var(--glass-line)}
.feature .n{font-size:30px;font-weight:700;color:var(--model);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.feature b{display:block;font-size:16px}
.feature span{font-size:13px;color:var(--muted)}

/* plot page */
.plothead{display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
@media (min-width:760px){.plothead{grid-template-columns:minmax(0,1fr) 230px}}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.crumbs a{color:var(--forest);font-weight:600;text-decoration:none}
.ph-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.ph-title h2{margin:0;font-size:38px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;background:var(--pc)}
.badge.e{--pc:#2b6cb0} .badge.w{--pc:#c56a12} .badge.n{--pc:#6a4f8f} .badge.m{--pc:#1f7a3a}
.badge.st.st-available{--pc:#8a7a4f}.badge.st.st-booked{--pc:#b87a12}.badge.st.st-registered{--pc:#c4520f}.badge.st.st-blocked{--pc:#646b67}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.facts div{background:var(--paper);border:1px solid var(--glass-line);border-radius:12px;padding:8px 10px;display:grid;gap:1px}
.facts span{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.facts b{font-size:15px}
.pnav{display:flex;gap:8px;margin-top:10px}
.pnav a{flex:1;text-align:center;text-decoration:none;font-weight:600;padding:9px;border-radius:12px;border:1px solid var(--glass-line);background:var(--paper)}
.locmap{background:#fff;border-radius:12px;border:1px solid var(--glass-line);overflow:hidden;height:250px;position:relative}
.locmap .mapzoom{position:absolute;left:0;top:0;width:100%}
.dtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;border-bottom:3px solid var(--dc)}
.dtab .n{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--paper);border-radius:999px;padding:1px 7px}
.dtab[aria-selected="true"]{background:var(--dc);color:var(--tab-ink);border-color:var(--dc)}
.dtab[aria-selected="true"] .n{color:var(--ink)}
.vtype{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vtype .lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vtype .seg{display:flex;border:1px solid var(--glass-line);border-radius:12px;overflow:hidden;background:var(--paper)}
.vtype .seg button{border:0;background:transparent;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.vtype .seg button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink)}
.conf{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.conf.ok{background:var(--ok-bg);color:var(--ok)}
.note{font-size:14px;line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--ref-bg);color:var(--ink)}
.note.warn{background:var(--warn-bg)}
.note a{color:var(--forest);font-weight:600}
.vlink{margin-left:auto;font-weight:600;font-size:14px;color:var(--forest);text-decoration:none;border:1.5px solid var(--forest);border-radius:10px;padding:6px 10px;background:var(--paper);white-space:nowrap}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.tbar .zbtn{font-size:14px;font-weight:600}
.tbar button:disabled{opacity:.45;cursor:default}
.tfill{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.tfill select,.ttab select,.ttab input{font:inherit;font-size:15px;height:40px;border:1px solid var(--glass-line);border-radius:10px;background:var(--paper);color:var(--ink);padding:0 8px;min-width:0}
.ttab{overflow-x:auto;border-radius:12px;border:1px solid var(--glass-line);background:var(--paper)}
.ttab table{width:100%;border-collapse:collapse;font-size:15px}
.ttab th{text-align:left;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px;border-bottom:1px solid var(--glass-line);position:sticky;top:0;background:var(--paper)}
.ttab td{padding:6px 8px;border-bottom:1px solid var(--glass-line);vertical-align:middle}
.ttab td a{text-decoration:none;color:var(--forest)}
.ttab .num{text-align:right;font-variant-numeric:tabular-nums}
.ttab select{width:100%;min-width:150px}.ttab input{width:100%;min-width:140px}
.ttab tr.chg td{background:var(--warn-bg)}
.ttab select.sel-booked{color:#b87a12;font-weight:600}.ttab select.sel-registered{color:#c4520f;font-weight:600}.ttab select.sel-blocked{color:#646b67;font-weight:600}

/* ---------- viewer ---------- */
const lib=window.pdfjsLib;
if(lib){ lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
const docs={};
let cur=null, curPage=1, zoom=1, rot=0, task=null, pageObj=null;
const stage=$("stage"), wrap=$("paperwrap"), cv=$("cv"), msg=$("vmsg");
function getDoc(key){ if(!docs[key]) docs[key]=lib.getDocument({url:pdfUrl({f:key})}).promise; return docs[key]; }
function openSheet(code,push){
  const base=byCode[code]; if(!base) return;
  const s=currentList.find(x=>x.code===code)||base;
  cur=s; curPage=s.page; rot=s.rot||0; zoom=1;
  if(!currentList.some(x=>x.code===code)) currentList=[s];
  $("viewer").hidden=false; document.body.style.overflow="hidden";
  if(push){ try{ history.pushState({sheet:code},"","#"+code);}catch(e){} }
  showSheet();
}
function closeViewer(fromPop){
  $("viewer").hidden=true; document.body.style.overflow=""; if(task){try{task.cancel()}catch(e){}}
  if(!fromPop){ try{ if(history.state&&history.state.sheet) history.back(); else history.replaceState(null,"","#"+route);}catch(e){} }
}
function showSheet(){
  const s=cur, idx=currentList.indexOf(s);
  $("vt-a").textContent=[s.code,s.no,s.rev&&s.rev!=="—"?s.rev:"",s.date,ST[s.st]].filter(Boolean).join(" · ");
  $("vt-b").textContent=s.title;
  { const cc=CADMAP[s.code]&&cadByCode[CADMAP[s.code]]; $("vdwg").hidden=!cc; if(cc) $("vdwg").href=cadUrl(cc); }
  { const o=OLDREV[s.code]||[]; $("vold").hidden=!o.length; $("vold").textContent=o.length?"Old revs ("+o.length+")":""; }
  $("vpdf").href=pdfUrl(s)+"#page="+curPage;
  $("vpos").textContent=(idx+1)+"/"+currentList.length;
  $("vprev").disabled=idx<=0; $("vnext").disabled=idx>=currentList.length-1;
  const multi=s.pages>1; $("pgctl").hidden=!multi;
  if(multi){ const rel=curPage-s.page+1; $("ppos").textContent=rel+"/"+s.pages; $("pprev").disabled=rel<=1; $("pnext").disabled=rel>=s.pages; }
  if(!lib){ msg.hidden=false; msg.textContent="The sheet viewer could not load. Tap “PDF original” to open the drawing."; return; }
  cv.style.visibility="hidden"; msg.hidden=false;
  msg.textContent=`Loading ${s.code}… (${(F[s.f][1]/1024).toFixed(1)} MB file)`;
  const want=s.code+":"+curPage;
  getDoc(s.f).then(d=>d.getPage(curPage)).then(p=>{
    if(cur.code+":"+curPage!==want) return;
    pageObj=p; stage.scrollTop=0; stage.scrollLeft=0; draw();
  }).catch(err=>{ msg.textContent="Couldn't open this sheet here. Tap “PDF original” to view it. ("+(err&&err.message||err)+")"; });
}
function draw(keep){
  if(!pageObj) return;
  const r=(pageObj.rotate+rot)%360;
  const v1=pageObj.getViewport({scale:1,rotation:r});
  const avail=Math.max(200,stage.clientWidth-16), availH=Math.max(200,stage.clientHeight-16);
  const scale=Math.min(avail/v1.width, availH/v1.height)*zoom;
  const vp=pageObj.getViewport({scale,rotation:r});
  let dpr=Math.min(window.devicePixelRatio||1,3);
  const maxPx=16e6; if(vp.width*vp.height*dpr*dpr>maxPx) dpr=Math.sqrt(maxPx/(vp.width*vp.height));
  const vpx=pageObj.getViewport({scale:scale*dpr,rotation:r});
  if(task){try{task.cancel()}catch(e){}}

function setZoom(z,cx,cy){

let pinch=null, lastTap=0;
stage.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    const [a,b]=e.touches, rc=stage.getBoundingClientRect();
    const mx=(a.clientX+b.clientX)/2-rc.left, my=(a.clientY+b.clientY)/2-rc.top;
    const top=parseFloat(wrap.style.marginTop)||0;
    pinch={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),mx,my,s:1};

    else lastTap=now;

},{passive:false});

    e.preventDefault();

},{passive:false});

  if(pinch&&e.touches.length<2){ const p=pinch; pinch=null; if(Math.abs(p.s-1)>0.03) setZoom(zoom*p.s,p.mx,p.my); else wrap.style.transform=""; }

      <div class="tbar"><button type="button" class="portal-link" id="uGo">Save update</button><span class="tsave" id="psave"></span></div></div>`:"";
  const rl=rfiList(p.no), list=rl.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))), num={};
  rl.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at))).forEach((r,i)=>num[r.id]=i+1);
  const rfis=list.map(r=>`<div class="rfi rst-${r.status}" data-rfi="${esc(r.id)}">
      <div class="rfi-h"><b>RFI ${p.no}-${String(num[r.id]).padStart(2,"0")}</b><span class="pill rp-${r.status}">${RST[r.status]||r.status}</span>${r.sheet&&byCode[r.sheet]?`<button type="button" class="linkbtn" data-open="${esc(r.sheet)}">${esc(r.sheet)} · ${esc(r.sheetTitle||byCode[r.sheet].title)}${r.rev?" · "+esc(r.rev):""}</button>`:`<span class="muted">${esc(r.sheetTitle||"General / site query")}</span>`}</div>
      <p class="rfi-q">${esc(r.q||"")}</p>
      ${(r.photos||[]).length?`<div class="phs">${r.photos.map(x=>`<a href="${esc(photoSrc(x))}" target="_blank" rel="noopener"><img src="${esc(photoSrc(x))}" alt="RFI photo" loading="lazy"></a>`).join("")}</div>`:""}
      <p class="muted">Raised${r.by?" by "+esc(who(r.by)):""} · ${fmtD(r.at)}</p>
      ${(r.replies||[]).map(x=>`<div class="rep"><span class="muted">${x.by?esc(who(x.by))+" · ":""}${fmtD(x.at)}</span><p>${esc(x.text)}</p></div>`).join("")}
      ${can?`<div class="rfi-a"><textarea rows="2" data-rtx="${esc(r.id)}" placeholder="Reply or clarification"></textarea><div class="tbar"><button type="button" class="zbtn" data-rsend="${esc(r.id)}">Send reply</button>${r.status!=="answered"?`<button type="button" class="zbtn" data-rset="answered" data-rid="${esc(r.id)}">Mark answered</button>`:""}${r.status!=="closed"?`<button type="button" class="zbtn" data-rset="closed" data-rid="${esc(r.id)}">Close</button>`:`<button type="button" class="zbtn" data-rset="open" data-rid="${esc(r.id)}">Reopen</button>`}</div></div>`:""}
    </div>`).join("");
  const syncNote=!IS_ART?`<p class="hint">${GHPROG&&GHPROG.syncedAt?`Updates as of ${fmtD(GHPROG.syncedAt)}. `:""}Site engineers record updates in the <a href="${ART_LINK}" target="_blank" rel="noopener">Claude version</a>; they appear here when synced. No login? Use WhatsApp below.</p>`:(can?"":`<p class="hint">View only. Ask Vamsi to invite you as an Editor to add updates, or send them on WhatsApp.</p>`);
  return `<div class="card prog" id="pSum"><div class="card-h"><div><h2>Site progress · ${progPct(p.no)}%</h2><p>${esc(progNow(p.no))}${ups.length?` · ${ups.length} update${ups.length>1?"s":""}, latest ${fmtD(ups.map(u=>u.date).sort().pop())}`:""}</p></div></div>
      <div class="pbar"><i style="width:${progPct(p.no)}%"></i></div>${syncNote}
      <div class="ttab"><table><thead><tr><th>Stage</th><th>Status</th><th>Started</th><th>Completed</th><th>Updates</th><th>Latest photos</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    ${form}
    <div class="card" id="pTl"><div class="card-h"><div><h2>Updates by date</h2><p>Every site visit is kept: newest first, with its photos.</p></div></div>${tl||`<p class="muted">No updates for Plot ${p.no} yet.</p>`}</div>
    <div class="card" id="pRfi"><div class="card-h"><div><h2>RFIs &amp; clarifications · ${rl.filter(r=>r.status==="open").length} open</h2><p>Ask about any drawing for this plot. The architect's team answers here.</p></div>${can?`<button type="button" class="portal-link" data-newrfi="${p.no}">Raise RFI</button>`:""}</div>
      ${rfis||`<p class="muted">No RFIs raised for Plot ${p.no} yet.</p>`}</div>
    ${wa}`;
}
function bindProgTab(p){
  const box=$("ptab"); if(!box) return;
  const go2=$("uGo");
  if(go2) go2.onclick=async()=>{ const ps=$("psave"), date=$("uDate").value, stage=$("uStage").value, st=$("uSt").value, note=$("uNote").value.trim(), ph=$("uPh");
    if(!date){ ps.textContent="Pick the date."; ps.className="tsave error"; return; }
    if(!note&&!(ph&&ph.files.length)){ ps.textContent="Add a note or a photo."; ps.className="tsave error"; return; }
    go2.disabled=true; ps.className="tsave saving"; ps.textContent=ph&&ph.files.length?"Uploading photos…":"Saving…";
    try{ const photos=ph&&ph.files.length?await uploadPhotos([...ph.files]):[];
      const u={plot:p.no,date,stage,st,note,photos,at:new Date().toISOString(),by:myId||""};
      await DB.collection("updates").add(u);
      const all=(UPD[p.no]||[]).concat([u]);
      await DB.doc("progress/"+p.no).set({stages:summarise(all),updatedAt:u.at,by:u.by});
      ps.className="tsave saved"; ps.textContent="Saved.";
      if($("uNote")&&$("uNote").value.trim()===note) $("uNote").value=""; if($("uPh")&&ph&&$("uPh")===ph) ph.value="";
    }catch(e){ ps.className="tsave error"; ps.textContent=e&&e.code==="invalid_argument"?"This account can view progress but not add updates.":"Not saved. Check your connection and try again."; }
    go2.disabled=false; };
  box.querySelectorAll("[data-newrfi]").forEach(b=>b.onclick=()=>openRfiDlg(p.no,null));
  box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSheet(b.dataset.open,true));
  box.querySelectorAll("[data-rsend]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.rsend, ta=box.querySelector(`[data-rtx="${id}"]`), t=ta.value.trim(); if(!t) return; const r=RFIS.find(x=>x.id===id); b.disabled=true;
    try{ await DB.doc("rfi/"+id).update({replies:(r.replies||[]).concat([{by:myId,at:new Date().toISOString(),text:t}])}); ta.value=""; }catch(e){ alertMsg("Reply not sent. Check your connection and try again."); } b.disabled=false; });
  box.querySelectorAll("[data-rset]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await DB.doc("rfi/"+b.dataset.rid).update({status:b.dataset.rset}); }catch(e){ alertMsg("Could not update the RFI. Try again."); } b.disabled=false; });
}
function alertMsg(t){ const el=$("ttoast")||document.body.appendChild(Object.assign(document.createElement("div"),{id:"ttoast"})); el.textContent=t; el.className="ttoast tsave error"; setTimeout(()=>{ el.className="ttoast"; },4000); }

/* RFI dialog */
function openRfiDlg(plotNo,code){
  const dlg=$("rfiDlg"); rfiCtx={plot:plotNo||"",code:code||""};
  const ps=$("rfiPlot"); ps.innerHTML=`<option value="">Choose plot</option>`+plotOrder().map(p=>`<option value="${p.no}"${p.no===rfiCtx.plot?" selected":""}>Plot ${p.no}</option>`).join("");
  fillRfiSheets(); $("rfiQ").value=""; $("rfiPh").value=""; $("rfiMsg").textContent="";
  $("rfiPhRow").hidden=!assetsNs; dlg.hidden=false; setTimeout(()=>$("rfiQ").focus(),50);
}
function fillRfiSheets(){ const no=$("rfiPlot").value, p=plotBy[no]; const list=p?plotSheets(p):[];
  $("rfiSheet").innerHTML=`<option value="">General / site query</option>`+list.map(s=>`<option value="${s.code}"${s.code===rfiCtx.code?" selected":""}>${esc(s.code)} · ${esc(s.title)}${s.rev&&s.rev!=="—"?" · "+esc(s.rev):""}</option>`).join("")+(rfiCtx.code&&!list.some(s=>s.code===rfiCtx.code)&&byCode[rfiCtx.code]?`<option value="${rfiCtx.code}" selected>${esc(rfiCtx.code)} · ${esc(byCode[rfiCtx.code].title)}</option>`:"");
  $("rfiWa").href=waRfi(p,byCode[$("rfiSheet").value]||null); }
async function submitRfi(){
  const no=$("rfiPlot").value, code=$("rfiSheet").value, q=$("rfiQ").value.trim(), msg=$("rfiMsg");
  if(!no){ msg.textContent="Choose the plot."; return; } if(!q){ msg.textContent="Write your question."; return; }
  const btn=$("rfiGo"); btn.disabled=true; msg.textContent="Sending…";
  try{ const s=byCode[code]; const photos=assetsNs&&$("rfiPh").files.length?await uploadPhotos([...$("rfiPh").files]):[];
    await DB.collection("rfi").add({plot:no,sheet:code||"",rev:s&&s.rev!=="—"?s.rev:"",sheetTitle:s?s.title:"General / site query",q,photos,status:"open",at:new Date().toISOString(),by:myId||"",replies:[]});
    $("rfiDlg").hidden=true; if(!$("viewer").hidden) closeViewer(false); ptab="prog"; go("plot-"+no);
  }catch(e){ msg.textContent=e&&e.code==="invalid_argument"?"This account cannot raise RFIs here. Use WhatsApp instead.":"Not sent. Check your connection and try again."; }
  btn.disabled=false;
}
$("rfiPlot").onchange=()=>{ rfiCtx.code=""; fillRfiSheets(); };
$("rfiSheet").onchange=()=>{ const p=plotBy[$("rfiPlot").value]; $("rfiWa").href=waRfi(p,byCode[$("rfiSheet").value]||null); };
$("rfiCancel").onclick=()=>{ $("rfiDlg").hidden=true; };
$("rfiGo").onclick=submitRfi;
$("vrfi").onclick=()=>{ const no=route.startsWith("plot-")?route.slice(5):""; if(dbOn&&canSite){ openRfiDlg(no,cur&&cur.code); } else { window.open(waRfi(plotBy[no],cur),"_blank","noopener"); } };
/* all-plots overview */
function renderProgress(){
  const rows=plotOrder().map(p=>{ const o=openRfis(p.no).length, rec=PROG[p.no];
    return `<tr><td><a href="#plot-${p.no}" data-prog="1"><b>${p.no}</b></a></td><td><span class="pill ${colCls(p).replace("vt-","vtp-").replace("st-","vtp-")}">${esc(isOffPlot(p)?statusTxt(p):((PLOT_INFO[p.no]||{}).type==="custom"?"Custom":(PLOT_INFO[p.no]||{}).type?vtLabel(PLOT_INFO[p.no].type,p):"Not confirmed"))}</span></td>
      <td>${esc(progNow(p.no))}</td><td><div class="pbar sm"><i style="width:${progPct(p.no)}%"></i></div><span class="muted">${progPct(p.no)}%</span></td><td class="num">${o?`<b class="rfi-n">${o}</b>`:"0"}</td><td>${rec&&rec.updatedAt?fmtD(rec.updatedAt):""}</td></tr>`; }).join("");
  const open=RFIS.filter(r=>r.status==="open").sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  $("main").innerHTML= (!IS_ART&&!GHPROG) ? `<div class="card"><div class="card-h"><div><h2>Site progress &amp; RFIs</h2><p>Progress and RFIs are recorded in the Claude version of this portal by site engineers Vamsi has invited.</p></div></div><div class="tbar"><a class="portal-link" href="${ART_LINK}" target="_blank" rel="noopener">Open the Claude version</a></div><p class="hint">No login? Open a plot, go to its Site tab and send progress or an RFI on WhatsApp.</p></div>${footerHTML()}`
   : `<div class="card"><div class="card-h"><div><h2>Site progress &amp; RFIs</h2><p>${(dbOn||GHPROG)?`${!IS_ART&&GHPROG.syncedAt?"As of "+fmtD(GHPROG.syncedAt)+" · ":""}${PLOTS.filter(p=>progPct(p.no)>0).length} plots started · ${open.length} open RFIs. Tap a plot to update its progress or answer its RFIs.`:"Progress and RFIs are not available on this view."}</p></div></div>
      ${open.length?`<div class="rfi-all">${open.map(r=>`<a class="rfi-row" href="#plot-${esc(r.plot)}" data-prog="1"><b>Plot ${esc(r.plot)}</b><span class="pill rp-${r.status}">${RST[r.status]}</span><span>${esc(r.sheet||"General")}</span><span class="muted">${esc((r.q||"").slice(0,90))}</span><span class="muted">${fmtD(r.at)}</span></a>`).join("")}</div>`:""}
      <div class="ttab"><table><thead><tr><th>Plot</th><th>Villa</th><th>Now</th><th>Progress</th><th class="num">Open RFIs</th><th>Updated</th></tr></thead><tbody>${rows}</tbody></table></div></div>${footerHTML()}`;
  $("main").querySelectorAll("[data-prog]").forEach(a=>a.addEventListener("click",()=>{ ptab="prog"; }));
  currentList=[];
}
function refreshSiteViews(){
  if(!$("rfiDlg").hidden||!$("viewer").hidden) return;
  const a=document.activeElement; if(a&&a.closest&&a.closest("#ptab")&&(a.tagName==="TEXTAREA"&&a.value.trim()||a.tagName==="INPUT"&&a.type==="text")) return;
  if(route==="progress") renderProgress();
  else if(route.startsWith("plot-")&&ptab==="prog"&&$("pSum")&&plotBy[route.slice(5)]){ const p=plotBy[route.slice(5)], tmp=document.createElement("div"); tmp.innerHTML=progTabHTML(p);
    const typingRfi=a&&a.closest&&a.closest("#pRfi")&&a.tagName==="TEXTAREA"&&a.value.trim();
    ["pSum","pTl","pRfi"].forEach(id=>{ if(id==="pRfi"&&typingRfi) return; const o=$(id), n=tmp.querySelector("#"+id); if(o&&n) o.replaceWith(n); });
    if(!$("uGo")&&tmp.querySelector(".upd")) { redrawTab&&redrawTab(false); return; }
    bindProgTab(p); const n=document.querySelector('.dtab[data-k="prog"] .n'); if(n) n.textContent=progPct(p.no)+"%"; }
  else if(route.startsWith("plot-")&&redrawTab) redrawTab(false);
}


/* boot */
handleRoute();
fetch(typesUrl(),{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(o=>{ fileTypes=o; refreshTypes(); }).catch(()=>{});
connectDb();
if(!IS_ART) fetch(FILE_ROOT+"data/progress.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(o=>{ if(o&&o.plots){ GHPROG=o; RFIS=[].concat(...Object.keys(o.plots).map(k=>(o.plots[k].rfis||[]).map(r=>Object.assign({plot:k},r)))); refreshSiteViews(); if(route==="home") render(); } }).catch(()=>{});
})();
</script>
